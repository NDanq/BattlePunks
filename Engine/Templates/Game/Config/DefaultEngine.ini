; @PROJECT_NAME@ default configuration.
;
; The master copy: the build stages it to Binaries/<Platform>_<Config>/Config/,
; where Application::Initialize() reads it, and overwrites the staged copy on
; the next build. Edit > Project Settings in the editor edits this file.
;
; Keys are declared by NIMBLE_CONFIG_* (the engine's in
; Engine/Source/Private/NimbleEngine/NimbleEngine.cpp); one that matches none
; is logged and ignored. Games/Sandbox/Config/DefaultEngine.ini explains each.

[Display]
ResolutionX=1280
ResolutionY=720

; Frames per second the game loop is paced to; 0 runs unlimited.
FrameRateLimit=60

; 0=Null, 1=OpenGL, 2=Vulkan, 3=Metal, 4=D3D12 (GDIDefinitions.h).
RHI=2

[Application]
Title=@PROJECT_NAME@

; Quit after this many frames; 0 runs until the window is closed.
MaxFrames=0

; The game module the launcher and the editor load (beside the executable),
; and the world it starts in (a [World_*] name below).
[Game]
Module=@PROJECT_NAME@Game
StartLevel=@PROJECT_NAME@

; The project's worlds, one section each, in order: each is a level named by
; its section. Project Settings > Worlds edits them (NimbleEngine/WorldList.h).
;   File           the .nmworld it loads; it names its game mode (World > World Settings)
;   StartupScript  a Lua file run once the world and its mode load; absent: none
;   Cook           cooked and packaged by Build > Build Project
[World_@PROJECT_NAME@]
File=Content/Levels/@PROJECT_NAME@.nmworld
StartupScript=Scripts/Main.lua
Cook=true

; Optional engine modules this project builds with. Read by CMake when the
; game configures (Engine/cmake/NimbleProject.cmake), so a change takes effect
; at the next build; Project Settings > Project > Modules edits them.
;   NetCore     networking: replication, RPCs, <Game>Server, -connect
;   JoltPhysics physics: Rigid Body and Physics Constraint components
[Modules]
NetCore=true
JoltPhysics=false
