; TimeOfDay's defaults, loaded before the project's Config/DefaultEngine.ini:
; a [TimeOfDay] key there wins over the same key here.

[TimeOfDay]
; Real minutes in one game day, for a Time Of Day component whose own
; Day Length is 0.
DayLengthMinutes=24
; Every clock at once, x this; 0 stops them all. Console: TimeOfDay.Speed 10
Speed=1
; 0-24 pins every clock at that hour, for a preview or a screenshot
; (-TimeOfDay.Hour=18.5); -1 lets them run.
Hour=-1
