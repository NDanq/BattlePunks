; Weather's defaults, loaded before the project's Config/DefaultEngine.ini:
; a [Weather] key there wins over the same key here.

[Weather]
; 0-1 pins every Weather component's Rain (a preview or a screenshot:
; -Weather.Rain=0.8); below 0 leaves them alone.
Rain=-1
; The same for Wetness; below 0, each follows its own (or its rain).
Wetness=-1
; Times the rain's drops: 0 draws no rain particles, 0.5 half as many (a
; scalability knob; wetness and mist are unaffected).
RainDensity=1
