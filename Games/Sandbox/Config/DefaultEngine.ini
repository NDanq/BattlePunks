; Sandbox default configuration.
;
; This file is the master copy. The build stages it next to the executable in
; Binaries/<Platform>_<Config>/Config/, which is where Application::Initialize()
; looks for it -- edits to the staged copy are overwritten by the next build.
;
; Every key here is declared by a NIMBLE_CONFIG_* in
; Engine/Source/Private/NimbleEngine/NimbleEngine.cpp. A key that does not match
; a declared var is logged and ignored, so a typo is visible rather than silent.

[Display]
ResolutionX=1280
ResolutionY=720

; Frames per second the game loop is paced to. 0 RUNS UNLIMITED.
;
; Unlimited is what bring-up and throughput measurement want -- and what the
; loop did before pacing existed, spinning at roughly 200,000 iterations per
; second with two cores pegged and a delta time too small to integrate
; meaningfully. A shipped game wants a number here.
;
; Pacing sleeps for the bulk of the wait and yields through the last 2ms, so it
; gives the core back rather than spinning. A game can change this at runtime
; with Application::SetFrameRateLimit().
FrameRateLimit=60

; Which backend InitializeGDI builds, matching ERenderPlatform in
; GDIDefinitions.h: 0=Null, 1=OpenGL, 2=Vulkan, 3=Metal, 4=D3D12.
;
; Vulkan (2) is the default and the one that actually draws: it creates its own
; instance, surface and swapchain from the window handle, and the engine
; presents each finished frame through RenderCore::Renderer::PresentToWindow.
;
; Null (0) draws nothing by design -- no GPU, no window needed -- and is what
; the smoke tests run and what the game/render thread split was brought up on.
; Set it here for a headless or driver-less machine; everything still ticks,
; and frames_rendered/draw_calls still advance, there is simply no image.
;
; OpenGL (1) does NOT start: it needs a WGL context made current on the render
; thread, which the host does not build yet, so it fails startup cleanly rather
; than tripping a fatal check later. Metal (3) is Apple-only. D3D12 (4) has a
; backend and cooked shaders but has not been brought up through this path.
RHI=2

[Application]
Title=NimbleEngine Sandbox

; Quit after this many frames. 0 runs until the window is closed.
;
; Non-zero exists so the frame loop, the render-thread handshake and the leak
; check can be exercised without a human closing a window -- there is no other
; way to get a deterministic run out of something whose exit condition is an OS
; event.
MaxFrames=0

; ---------------------------------------------------------------------------
; Keys below are declared by the GAME (SandboxMain.cpp), not the engine. They
; reach the same registry through the same NIMBLE_CONFIG_* macros, which is how
; a game extends configuration without the engine knowing about it.
; ---------------------------------------------------------------------------

[Sandbox]

; Quit this many seconds after startup; 0 runs until the window is closed.
;
; Not the same thing as [Application] MaxFrames. That is an engine bring-up knob
; that counts loop iterations. This is game logic in game terms, and it ends the
; run by calling Application::RequestQuit() rather than by the engine counting
; on the game's behalf.
RunSeconds=0

; ---------------------------------------------------------------------------
; [Scripting] is declared by the ENGINE (NimbleEngine.cpp), not the game --
; reachable from any game's own DefaultEngine.ini the same way [Display] is.
; ---------------------------------------------------------------------------

[Scripting]

; Bundle-relative path to a Lua file run once, after Sandbox's own OnStartup
; succeeds and before the first tick. Empty skips scripting entirely.
StartupScript=Scripts/Main.lua
