; Sandbox default configuration.
;
; This file is the master copy. The build stages it next to the executable in
; Binaries/<Platform>_<Config>/Config/, which is where Application::Initialize()
; looks for it -- edits to the staged copy are overwritten by the next build.
;
; Every key here is declared by a NIMBLE_CONFIG_* in
; Engine/Source/Private/NimbleEngine/NimbleEngine.cpp. A key that does not match
; a declared var is logged and ignored, so a typo is visible rather than silent.

[Display]
ResolutionX=1280
ResolutionY=720

; Frames per second the game loop is paced to. 0 RUNS UNLIMITED.
;
; Unlimited is what bring-up and throughput measurement want -- and what the
; loop did before pacing existed, spinning at roughly 200,000 iterations per
; second with two cores pegged and a delta time too small to integrate
; meaningfully. A shipped game wants a number here.
;
; Pacing sleeps for the bulk of the wait and yields through the last 2ms, so it
; gives the core back rather than spinning. A game can change this at runtime
; with Application::SetFrameRateLimit().
FrameRateLimit=60

; Which backend InitializeGDI builds, matching ERenderPlatform in
; GDIDefinitions.h: 0=Null, 1=OpenGL, 2=Vulkan, 3=Metal, 4=D3D12.
;
; Vulkan (2) is the default: it creates its own instance, surface and swapchain
; from the window handle, and the engine presents each finished frame through
; RenderCore::Renderer::PresentToWindow. D3D12 (4) draws the same way: its
; device needs no window, and its swapchain comes from the same handle.
;
; Null (0) draws nothing by design -- no GPU, no window needed -- and is what
; the smoke tests run and what the game/render thread split was brought up on.
; Set it here for a headless or driver-less machine; everything still ticks,
; and frames_rendered/draw_calls still advance, there is simply no image.
;
; OpenGL (1) does NOT start: it needs a WGL context made current on the render
; thread, which the host does not build yet, so it fails startup cleanly rather
; than tripping a fatal check later. Metal (3) is Apple-only.
RHI=2

[Application]
Title=NimbleEngine Sandbox

; Quit after this many frames. 0 runs until the window is closed.
;
; Non-zero exists so the frame loop, the render-thread handshake and the leak
; check can be exercised without a human closing a window -- there is no other
; way to get a deterministic run out of something whose exit condition is an OS
; event.
MaxFrames=0

; Which game module the launcher (and the editor) loads, and the world it starts
; in. Declared by the engine (GameModule.cpp). Module names the library beside
; the executable -- SandboxGame.dll; StartLevel names a [World_*] below (empty:
; the first).
[Game]
Module=SandboxGame
StartLevel=BrickBreaker

; The project's worlds, one section each, in order: each is a level named by
; its section. Project Settings > Worlds edits them (NimbleEngine/WorldList.h).
;   File           the .nmworld it loads
;   GameMode       its rules: a mode the game module registers; empty: none
;   StartupScript  a Lua file run once the world and its mode load; absent: none
;   Cook           cooked and packaged by Build > Build Project
[World_BrickBreaker]
File=Content/Levels/BrickBreaker.nmworld
GameMode=BrickBreaker
Cook=true

; The scripting and save/load demo: an empty world the mode and Main.lua fill.
[World_Sandbox]
File=Content/Levels/Sandbox.nmworld
GameMode=Sandbox
StartupScript=Scripts/Main.lua
Cook=true

; Optional engine modules this project builds with. Read by CMake when the
; game configures (Engine/cmake/NimbleProject.cmake), so a change takes effect
; at the next build; Project Settings > Project > Modules edits them.
;   NetCore     networking: replication, RPCs, <Game>Server, -connect
;   JoltPhysics physics: Rigid Body and Physics Constraint components
[Modules]
NetCore=true
JoltPhysics=false

; ---------------------------------------------------------------------------
; Keys below are declared by the GAME (SandboxGame.cpp), not the engine. They
; reach the same registry through the same NIMBLE_CONFIG_* macros, which is how
; a game extends configuration without the engine knowing about it.
; ---------------------------------------------------------------------------

[BrickBreaker]

; 1 plays by itself: the paddle follows the ball, launches it and restarts
; after a game over. For unattended runs; any steering takes over. 2 launches
; and restarts but never steers, so every ball is lost (lives, game over).
AutoPlay=0

; Quit this many seconds after the level starts; 0 runs until the window closes.
RunSeconds=0

[Sandbox]

; Quit this many seconds after startup; 0 runs until the window is closed.
;
; Not the same thing as [Application] MaxFrames. That is an engine bring-up knob
; that counts loop iterations. This is game logic in game terms, and it ends the
; run by calling Application::RequestQuit() rather than by the engine counting
; on the game's behalf.
RunSeconds=0

; ---------------------------------------------------------------------------
; [Input_Default] rebinds SandboxInput.cpp's "Default" input map without a
; rebuild: one line per action or axis, keys by name (Engine/Source/INPUT.md).
; A '-' negates an axis key. The console takes the same, live:
;   Input_Default.Jump K, Gamepad.South
; ---------------------------------------------------------------------------

[Input_Default]
; Jump = K, Gamepad.South
; MoveX = L, -J, Gamepad.LeftX
