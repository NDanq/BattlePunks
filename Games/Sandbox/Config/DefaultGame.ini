; Sandbox game configuration: the game's own settings, beside DefaultEngine.ini.
;
; Loaded after DefaultEngine.ini, so a key set in both takes this value.
; Staged and packed with Config/ like it. Edit > Project Settings > Input
; writes its [Input_*] sections here.

; ---------------------------------------------------------------------------
; [Input_Default] rebinds SandboxInput.cpp's "Default" input map without a
; rebuild: one line per action or axis, keys by name (Engine/Source/INPUT.md).
; A '-' negates an axis key. The console takes the same, live:
;   Input_Default.Jump K, Gamepad.South
; ---------------------------------------------------------------------------

[Input_Default]
; Jump = K, Gamepad.South
; MoveX = L, -J, Gamepad.LeftX
