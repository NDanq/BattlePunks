; LightLab game configuration: the game's own settings, beside DefaultEngine.ini.
;
; Loaded after DefaultEngine.ini, so a key set in both takes this value.
; Staged and packed with Config/ like it. Edit > Project Settings > Input
; writes its [Input_*] sections here.

; ---------------------------------------------------------------------------
; [Input_Default] rebinds LightLabInput.cpp's "Default" input map without a
; rebuild (Engine/Source/INPUT.md). The console takes the same, live.
; ---------------------------------------------------------------------------

[Input_Default]
; CycleTechnique = T, Gamepad.North
; ToggleShadows = F, Gamepad.West
