; LightLab default configuration.
;
; This file is the master copy. The build stages it next to the executable in
; Binaries/<Platform>_<Config>/Config/, which is where Application::Initialize()
; looks for it -- edits to the staged copy are overwritten by the next build.
;
; Every key here is declared by a NIMBLE_CONFIG_* in the engine. A key that
; does not match a declared var is logged and ignored, so a typo is visible
; rather than silent.

[Display]
ResolutionX=1280
ResolutionY=720

; Frames per second the game loop is paced to. 0 runs unlimited.
FrameRateLimit=120

; Which backend InitializeGDI builds, matching ERenderPlatform in
; GDIDefinitions.h: 0=Null, 1=OpenGL, 2=Vulkan, 3=Metal, 4=D3D12.
; Null draws nothing (no GPU, no window needed) but everything still ticks.
RHI=2

[Application]
Title=NimbleEngine LightLab

; Quit after this many frames. 0 runs until the window is closed.
MaxFrames=0

; Which game module the launcher (and the editor) loads, and the level it
; starts in. Declared by the engine (GameModule.cpp).
[Game]
Module=LightLabGame
StartLevel=LightLab

; ---------------------------------------------------------------------------
; [Editor] is declared by the editor. StartupWorld is the world it opens when
; none is named on its command line: the level LightLab loads, relative to
; this project. The game loads the copy staged beside the executable.
; ---------------------------------------------------------------------------

[Editor]
StartupWorld=Content/Levels/LightLab.nmworld

; ---------------------------------------------------------------------------
; [Scripting] is declared by the engine. LightLab is all C++, so no startup
; script runs.
; ---------------------------------------------------------------------------

[Scripting]
StartupScript=

; ---------------------------------------------------------------------------
; [Shadows] is declared by RenderCore (ShadowSettings.cpp): every scene's
; shadow quality, over what each light asks for. Read each frame, so the
; console (or F in game, for Enabled) changes it live.
; ---------------------------------------------------------------------------

[Shadows]

; Master switch. 0 draws every light unshadowed.
Enabled=1

; Each shadow atlas's side in texels: 1024, 2048 or 4096.
Resolution=1024

; Edge filtering: 0 hard, 1 PCF 3x3, 2 PCF 5x5.
Filter=2

; How many point and spot lights may cast shadows at once, 0-4. LightLab has
; three shadowed local lights, so 4 shows them all.
MaxShadowedLights=1

; Times every sun's Shadow Distance: lower is sharper and shorter.
DistanceScale=1

; How many Render components with Cast Inset Shadow get a sun shadow map of
; their own, 0-4, largest on screen first. Each takes a tile of the point and
; spot lights' atlas that they leave (Resolution / 6 texels a side).
MaxInsetShadows=4

; Their edge filtering, as Filter: 0 hard, 1 PCF 3x3, 2 PCF 5x5. Their maps
; are sharp already, so 3x3 is enough.
InsetFilter=0

; ---------------------------------------------------------------------------
; [Input_Default] rebinds LightLabInput.cpp's "Default" input map without a
; rebuild (Engine/Source/INPUT.md). The console takes the same, live.
; ---------------------------------------------------------------------------

[Input_Default]
; CycleTechnique = T, Gamepad.North
; ToggleShadows = F, Gamepad.West
