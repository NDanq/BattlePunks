; WorldsLab default configuration.
;
; The master copy: the build stages it to Binaries/<Platform>_<Config>/Config/,
; where Application::Initialize() reads it, and overwrites the staged copy on
; the next build. Edit > Project Settings in the editor edits this file.
;
; Keys are declared by NIMBLE_CONFIG_* (the engine's in
; Engine/Source/Private/NimbleEngine/NimbleEngine.cpp); one that matches none
; is logged and ignored. Games/Sandbox/Config/DefaultEngine.ini explains each.

[Display]
ResolutionX=1280
ResolutionY=720

; Frames per second the game loop is paced to; 0 runs unlimited.
FrameRateLimit=120

; 0=Null, 1=OpenGL, 2=Vulkan, 3=Metal, 4=D3D12 (GDIDefinitions.h).
RHI=2

[Application]
Title=WorldsLab

; Quit after this many frames; 0 runs until the window is closed.
MaxFrames=0

; The game module the launcher and the editor load (beside the executable),
; and the world it starts in (a [World_*] name below).
[Game]
Module=WorldsLabGame
StartLevel=ShootingRange

; The project's worlds, one section each, in order: each is a level named by
; its section. Project Settings > Worlds edits them (NimbleEngine/WorldList.h).
;   File           the .nmworld it loads; it names its game mode (World > World Settings)
;   StartupScript  a Lua file run once the world and its mode load; absent: none
;   Cook           cooked and packaged by Build > Build Project
[World_WorldsLab]
File=Content/Levels/WorldsLab.nmworld
StartupScript=Scripts/Main.lua
Cook=true

; The visual-style worlds, one per style (Tools/<Style>/ makes each).
; SteampunkStreet: a photoreal steampunk street corner, two blocks (1 x 2)
; of Victorian shop-houses round cobbled crossroads at sunset
; (Tools/Steampunk/make_steampunk_street.py). Walk it (WorldsLabExplore).
[World_Hills]
File=Content/Levels/Hills.nmworld
Cook=true

[World_Meadow]
File=Content/Levels/Meadow.nmworld
Cook=true

[World_SteampunkStreet]
File=Content/Levels/Steampunk/SteampunkStreet.nmworld
Cook=true

[World_SteampunkPvP]
File=Content/Levels/SteampunkPvP.nmworld
Cook=true

; Courtyard: a photoreal Spanish Colonial Revival house round a courtyard at
; sunset, baked lighting, its hearth flickering (Tools/Courtyard/, from
; LightLab). Its mode shadows four lights and turns on contact shadows.
[World_Courtyard]
File=Content/Levels/Courtyard.nmworld
Cook=true

; ShootingRange: a gritty steel-framed warehouse lit through skylights, a
; six-lane range with hinged steel plates and paper targets, stairs to grated
; catwalks over it (Tools/ShootingRange/). Its mode spawns the RangeShooter --
; the engine's crash dummy, armed -- at the Player Start (WorldsLabRange.cpp).
[World_ShootingRange]
File=Content/Levels/ShootingRange.nmworld
Cook=true

; ToonArena: AICore's demo (Engine/Modules/AICore/README.md) -- a candy-coloured
; yard in the Toony style (Tools/Toony/), three Red crash dummies against three
; Blue, each an AI Brain (Content/AI/ArenaBot.nmbt) walking the navmesh. Tab
; follows each bot; [WorldsLab] ArenaPlayer=1 puts you on Red; ArenaAutoplay=120
; plays two minutes, logs the match and quits (WorldsLabArena.cpp).
; GrassLab: a ball rolls through procedural grass, bending it through a custom render
; pass's trail (WorldsLabGrassLab.cpp); [WorldsLab] GrassLabAutoPlay=0 to steer it.
[World_GrassLab]
File=Content/Levels/GrassLab.nmworld
Cook=true

[World_ToonArena]
File=Content/Levels/ToonArena.nmworld
Cook=true

; DummyTest: the engine's CrashDummyDemo prefab alone (Engine/Content/Characters).
[World_DummyTest]
File=Content/Levels/DummyTest.nmworld
Cook=false

; Optional engine modules this project builds with. Read by CMake when the
; game configures (Engine/cmake/NimbleProject.cmake), so a change takes effect
; at the next build; Project Settings > Project > Modules edits them.
;   NetCore     networking: replication, RPCs, <Game>Server, -connect
;   JoltPhysics physics: Rigid Body and Physics Constraint components
[Modules]
NetCore=true
JoltPhysics=true

; The world the editor opens with no file named.
[Editor]
StartupWorld=Content/Levels/Steampunk/SteampunkStreet.nmworld

; Sun shadows sharp enough for a street: 2048 cascades, soft filtering.
[Shadows]
Enabled=1
Resolution=2048
Filter=2
MaxShadowedLights=2
DistanceScale=1
MaxInsetShadows=2
InsetFilter=1

; The explore mode's walking and flying (WorldsLabGame.cpp), and the Shooting
; Range's settings (WorldsLabRange.cpp): RangeLookSensitivity scales the mouse
; and stick look, RangeShowHelp shows the HUD's controls hint. The range's
; Settings menu (Content/UI/ShootingRange/Settings.nmui) changes these and the
; [Audio] and [Shadows] values below, and saves what it changed to the player's
; User.ini (<AppData>/NimbleEngine/WorldsLabGame/User.ini), which this file
; underlies: a key the player never changed follows this file.
[WorldsLab]
WalkSpeed=180
FlySpeed=900
LookSensitivity=1
EyeHeight=170
RangeLookSensitivity=1
RangeShowHelp=true

; Volumes, 0 to 1 (Engine/Modules/Audio): the range's Settings menu sets two.
[Audio]
MasterVolume=1
SFXVolume=1

; Build > Build Project's options. RunUncooked and BuildTests (the engine's
; test executables, beside the game) apply to Debug and RelWithDebInfo only:
; Shipping never runs uncooked and never builds tests.
[Build]
Configuration=RelWithDebInfo
Cook=true
Compile=true
OpenOutput=true
RunUncooked=false
BuildTests=false
