; DemoLab default configuration.
;
; The master copy: the build stages it to Binaries/<Platform>_<Config>/Config/,
; where Application::Initialize() reads it, and overwrites the staged copy on
; the next build. Edit > Project Settings in the editor edits this file.
;
; Keys are declared by NIMBLE_CONFIG_* (the engine's in
; Engine/Source/Private/NimbleEngine/NimbleEngine.cpp); one that matches none
; is logged and ignored. Games/Sandbox/Config/DefaultEngine.ini explains each.

[Display]
ResolutionX=1280
ResolutionY=720

; Frames per second the game loop is paced to; 0 runs unlimited.
FrameRateLimit=60

; 0=Null, 1=OpenGL, 2=Vulkan, 3=Metal, 4=D3D12 (GDIDefinitions.h).
RHI=2

[Application]
Title=DemoLab

; Quit after this many frames; 0 runs until the window is closed.
MaxFrames=0

; Scalability (Engine/Modules/RenderCore/SCALABILITY.md). The tier picks
; which entities render (each entity's Detail Mode) and lays its
; [Scalability_<Tier>] values over this file; the power profile lays
; [PowerProfile_Saver|Max] under that. The engine has its own table for each,
; so these sections only name what this game wants different. A key this file
; sets in its own section ([Shadows] Resolution=...) keeps that value at every
; tier unless a tier section names it too.
;   DetailMode    Low | Medium | High | Ultra
;   PowerProfile  Auto (PowerSaver on battery or mobile) | PowerSaver | PowerMax
[Scalability]
DetailMode=High
PowerProfile=Auto

; [Scalability_Low]
; Shadows.Resolution=1024
; Rendering.AllowVolumetricFog=false
;
; [PowerProfile_Saver]
; Display.FrameRateLimit=30
; Jobs.WorkerFraction=0.5

; The game module the launcher and the editor load (beside the executable),
; and the world it starts in (a [World_*] name below).
[Game]
Module=DemoLabGame
StartLevel=MainMenu

; The project's worlds, one section each, in order: each is a level named by
; its section. Project Settings > Worlds edits them (NimbleEngine/WorldList.h).
; Each .nmworld names its game mode (<Settings GameMode>): LabMenu for the
; menu, LabStory for the levels. Tools/Levels/make_levels.py writes them all.
;   File           the .nmworld it loads
;   StartupScript  a Lua file run once the world and its mode load; absent: none
;   Cook           cooked and packaged by Build > Build Project
[World_MainMenu]
File=Content/Levels/MainMenu.nmworld
StartupScript=Scripts/Main.lua
Cook=true

; Level 1: the island's coast, the switchback road, the gatehouse, the blast door.
[World_L1_Foothills]
File=Content/Levels/L1_Foothills.nmworld
Cook=true

; Level 2: one world, two states (the travel state's Alarm flag swaps the
; Calm_* and Alarm_* entity groups).
[World_L2_Laboratory]
File=Content/Levels/L2_Laboratory.nmworld
Cook=true

; Level 3: the ring gallery, the vault, the tunnel, the pump hall.
[World_L3_Core]
File=Content/Levels/L3_Core.nmworld
Cook=true

; Optional engine modules this project builds with. Read by CMake when the
; game configures (Engine/cmake/NimbleProject.cmake), so a change takes effect
; at the next build; Project Settings > Project > Modules edits them.
;   NetCore     networking: replication, RPCs, <Game>Server, -connect
;   JoltPhysics physics: Rigid Body and Physics Constraint components
[Modules]
NetCore=true
JoltPhysics=true
Audio=true
AICore=true

; Drop-in plugins (Engine/cmake/NimblePlugins.cmake): Engine/Plugins, and
; this project's own Plugins/ folder. Project Settings > Plugins.
[Plugins]
TimeOfDay=true

[Editor]
StartupWorld=Content/Levels/L1_Foothills.nmworld
