; DemoLab game configuration.
;
; The game's own settings, read after DefaultEngine.ini (a key in both takes
; this file's): game-scope config vars (NIMBLE_GAME_CONFIG_*) and the input
; maps' bindings, [Input_*]. Edit > Project Settings writes both here; a
; player's changes go to their User.ini.

[Display]
; Wait for the display's refresh at each present: no tearing, and the loop is
; held to the refresh rate as well as [Display] FrameRateLimit. false presents
; as soon as a frame is ready. Applies live (console: Display.VSync true).
VSync=false

; The engine's level transition (Engine/Docs/Guides/GameModeGuide.md, "The
; transition screen"): every level change fades out, shows Demo Lab's loading
; card (LabTravel::Travel gives its title and tip), swaps and fades in.
[LevelTransition]
Enabled=true
FadeOut=0.4
FadeIn=0.6
RevealFrames=2
Title=Demo Lab
Tip=
Document=Content/UI/Loading.nmui
